apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - prometheus-rules.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1" # picked up by the Grafana dashboard sidecar
configMapGenerator:
  - name: self-healing-dashboard
    files:
      - dashboards/self-healing.json
