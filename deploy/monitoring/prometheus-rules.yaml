# Symptom -> runbook mapping. The `remediation` label is the contract with the healer:
# Alertmanager routes anything carrying it to the healer's webhook, and its value picks the action.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: self-healing
  namespace: monitoring
spec:
  groups:
    - name: self-healing
      rules:
        - alert: PodStuckNotReady
          # Readiness failures stop traffic but never restart the pod: it stays stuck forever.
          expr: max by (namespace, pod) (kube_pod_status_ready{namespace="shop", condition="false"}) == 1
          for: 1m
          labels:
            severity: warning
            remediation: delete-pod
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been NotReady for over a minute"

        - alert: PodMemoryNearLimit
          # Recycle the pod gracefully before the OOM killer does it mid-request.
          expr: |
            max by (namespace, pod) (container_memory_working_set_bytes{namespace="shop", container="shop-api"})
              / max by (namespace, pod) (kube_pod_container_resource_limits{namespace="shop", container="shop-api", resource="memory"})
              > 0.8
          for: 30s
          labels:
            severity: warning
            remediation: delete-pod
          annotations:
            summary: "{{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit"

        - alert: HighErrorRate
          # A bad release: the healthy fix is the previous revision.
          expr: |
            sum by (namespace, deployment) (rate(http_requests_total{namespace="shop", code=~"5.."}[1m]))
              / sum by (namespace, deployment) (rate(http_requests_total{namespace="shop"}[1m]))
              > 0.2
          for: 30s
          labels:
            severity: critical
            remediation: rollback
          annotations:
            summary: "{{ $labels.deployment }} is failing {{ $value | humanizePercentage }} of requests"

        - alert: HighLatencyP95
          # Saturation: add capacity, bounded by the healer.io/max-replicas annotation.
          expr: |
            histogram_quantile(0.95,
              sum by (le, namespace, deployment) (rate(http_request_duration_seconds_bucket{namespace="shop"}[2m]))
            ) > 0.25
          for: 1m
          labels:
            severity: warning
            remediation: scale-up
          annotations:
            summary: "{{ $labels.deployment }} p95 latency is {{ $value | humanizeDuration }}"

        - alert: NodeNotReady
          # Kubernetes waits 5 minutes (default toleration) before moving pods off a dead node. We don't.
          expr: kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 1m
          labels:
            severity: critical
            remediation: cordon-drain
          annotations:
            summary: "Node {{ $labels.node }} is not Ready"
