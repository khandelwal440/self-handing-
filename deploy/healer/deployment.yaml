apiVersion: apps/v1
kind: Deployment
metadata:
  name: healer
  namespace: healer
  labels:
    app.kubernetes.io/name: healer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: healer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healer
    spec:
      serviceAccountName: healer
      # The healer must not live on the nodes it heals.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: healer
          image: healer:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: ALLOWED_NAMESPACES
              value: shop
            - name: DRY_RUN
              value: "false"
            - name: COOLDOWN_SECONDS
              value: "120"
            - name: ROLLBACK_COOLDOWN_SECONDS
              value: "600"
            - name: BUDGET_ACTIONS
              value: "10"
            - name: BUDGET_WINDOW_SECONDS
              value: "600"
            - name: MAX_CORDONED_NODES
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
