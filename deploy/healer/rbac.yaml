# Least privilege: exactly the verbs the four runbooks need, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healer
  namespace: healer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: healer
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, update]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: healer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: healer
subjects:
  - kind: ServiceAccount
    name: healer
    namespace: healer
