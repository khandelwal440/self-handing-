name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r healer/requirements.txt -r healer/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: healer

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin kubeconform
      - name: Validate manifests (including CRDs via the datree catalog)
        run: |
          CRDS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for dir in deploy/app deploy/healer deploy/monitoring; do
            kubectl kustomize "$dir" | kubeconform -strict -summary -ignore-missing-schemas -schema-location default -schema-location "$CRDS"
          done
          kubeconform -strict -summary -ignore-missing-schemas -schema-location default -schema-location "$CRDS" chaos/

  e2e:
    needs: [unit, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: self-healing
          config: cluster/kind-config.yaml
      - run: make images monitoring deploy
      - run: make e2e
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n healer logs deployment/healer --tail=200 || true
